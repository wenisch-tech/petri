replicaCount: 1
image:
  registry: ghcr.io
  repository: wenisch-tech/petri
  tag: 0.0.1
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
autoscaling:
  enabled: false
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}
metrics:
  path: /actuator/prometheus
  serviceAnnotations:
    enabled: true
  podAnnotations:
    enabled: false
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    annotations: {}
    honorLabels: false
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: petri.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi
# Petri defaults to an embedded H2 database written under mountPath. Enable
# persistence to keep it across restarts, or point the datasource at PostgreSQL
# below and leave this disabled.
persistence:
  enabled: false
  storageClassName: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /app/data
nodeSelector: {}
tolerations: []
affinity: {}
# Environment variables for Spring Boot and application configuration.
# Leave empty to keep the built-in H2 defaults.
env:
  # Set these three to run against PostgreSQL instead of the embedded H2
  # database. Flyway owns the schema on either, so nothing else changes.
  SPRING_DATASOURCE_URL: ""
  SPRING_DATASOURCE_USERNAME: ""
  SPRING_DATASOURCE_PASSWORD: ""
  # Agent gateway. The runner is enabled by default but has nothing to call
  # until a base URL is set, and says so at startup.
  PETRI_GATEWAY_BASE_URL: ""
  PETRI_GATEWAY_USERNAME: "petri"
  # A run is bounded by silence, not elapsed time: a single model call on a
  # contended GPU can legitimately take minutes.
  PETRI_GATEWAY_IDLE_TIMEOUT: "PT15M"
  PETRI_GATEWAY_MAX_DURATION: "PT1H"
  # The gateway lists only busy sessions, so a run is invisible between being
  # created and producing its first output.
  PETRI_GATEWAY_STARTUP_GRACE: "PT2M"
  # Where the agent works. Petri names one directory per card and never opens
  # it: this path exists on the agent's filesystem, not Petri's.
  PETRI_WORKSPACE_ROOT: "/workspaces/petri"
  # How many runs may be open at once. One by default: where model calls
  # serialise on a single GPU, a second turn waits in silence, and silence is
  # what the liveness poller treats as a hung turn.
  PETRI_MAX_CONCURRENT_RUNS: "1"
  # The forge. Petri's own token reads what landed and opens the pull request;
  # it never pushes.
  PETRI_FORGE_FORGEJO_BASE_URL: ""
  # Optionally hand the agent a credential so it can clone and push by itself.
  # Off by default: this decides who holds the push right. Prefer giving it its
  # own token below - that one may push, Petri's need not.
  PETRI_FORGE_FORGEJO_HAND_TOKEN_TO_AGENT: "false"
  PETRI_FORGE_FORGEJO_AGENT_USERNAME: "petri"
  # Reviewing model for verdict gates. Point at a different model from the one
  # writing the code. Unset means verdict gates hold rather than pass.
  PETRI_REVIEW_BASE_URL: ""
  PETRI_REVIEW_MODEL: "chatgpt"
  PETRI_SECURITY_USERNAME: "admin"
# Secrets for sensitive data.
# If a key is set in both `env` and `secrets`, the Secret-backed value wins.
secrets: {}
# SPRING_DATASOURCE_PASSWORD: "your-password"
# PETRI_GATEWAY_PASSWORD: "your-gateway-password"
# PETRI_REVIEW_API_KEY: "your-review-key"
# Petri's own forge token: read, and open a pull request. No push.
# PETRI_FORGE_FORGEJO_TOKEN: "a-forge-token"
# Only used when hand-token-to-agent is on. This is the one that may push.
# PETRI_FORGE_FORGEJO_AGENT_TOKEN: "a-push-token"
# Guards the write API, which queues agent work against real repositories.
# Unset means the API rejects every request rather than opening up.
# PETRI_SECURITY_API_KEY: "a-long-random-value"
# PETRI_SECURITY_PASSWORD: "board-login-password"
livenessProbe:
  enabled: true
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3
readinessProbe:
  enabled: true
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 5
startupProbe:
  enabled: true
  httpGet:
    path: /actuator/health
    port: http
  # Allow slower boots (migrations, cold starts) before liveness kicks in.
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30
