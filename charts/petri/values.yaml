replicaCount: 1
image:
  registry: ghcr.io
  repository: wenisch-tech/petri
  tag: 0.0.1
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
autoscaling:
  enabled: false
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}
metrics:
  path: /actuator/prometheus
  serviceAnnotations:
    enabled: true
  podAnnotations:
    enabled: false
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    annotations: {}
    honorLabels: false
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: petri.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi
# Petri defaults to an embedded H2 database written under mountPath. Enable
# persistence to keep it across restarts, or point the datasource at PostgreSQL
# below and leave this disabled.
persistence:
  enabled: false
  storageClassName: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /app/data
nodeSelector: {}
tolerations: []
affinity: {}
# Environment variables for Spring Boot and application configuration.
# Leave empty to keep the built-in H2 defaults.
env:
  # Set these three to run against PostgreSQL instead of the embedded H2
  # database. Flyway owns the schema on either, so nothing else changes.
  SPRING_DATASOURCE_URL: ""
  SPRING_DATASOURCE_USERNAME: ""
  SPRING_DATASOURCE_PASSWORD: ""
  # Agent gateway. The runner is enabled by default but has nothing to call
  # until a base URL is set, and says so at startup.
  PETRI_GATEWAY_BASE_URL: ""
  PETRI_GATEWAY_USERNAME: "petri"
  # A run is bounded by silence, not elapsed time: a single model call on a
  # contended GPU can legitimately take minutes.
  PETRI_GATEWAY_IDLE_TIMEOUT: "PT15M"
  PETRI_GATEWAY_MAX_DURATION: "PT1H"
  # The gateway lists only busy sessions, so a run is invisible between being
  # created and producing its first output.
  PETRI_GATEWAY_STARTUP_GRACE: "PT2M"
  # The repository shim is a second service on its own port. It holds the
  # credential and the push gate, so keep it in-cluster only.
  PETRI_GATEWAY_REPO_API_URL: ""
  # Reviewing model for verdict gates. Point at a different model from the one
  # writing the code. Unset means verdict gates hold rather than pass.
  PETRI_REVIEW_BASE_URL: ""
  PETRI_REVIEW_MODEL: "chatgpt"
  PETRI_SECURITY_USERNAME: "admin"
# Secrets for sensitive data.
# If a key is set in both `env` and `secrets`, the Secret-backed value wins.
secrets: {}
# SPRING_DATASOURCE_PASSWORD: "your-password"
# PETRI_GATEWAY_PASSWORD: "your-gateway-password"
# PETRI_REVIEW_API_KEY: "your-review-key"
# Guards the write API, which queues agent work against real repositories.
# Unset means the API rejects every request rather than opening up.
# PETRI_SECURITY_API_KEY: "a-long-random-value"
# PETRI_SECURITY_PASSWORD: "board-login-password"
livenessProbe:
  enabled: true
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3
readinessProbe:
  enabled: true
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 5
startupProbe:
  enabled: true
  httpGet:
    path: /actuator/health
    port: http
  # Allow slower boots (migrations, cold starts) before liveness kicks in.
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30
