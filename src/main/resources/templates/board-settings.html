<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(${board.name} + ' · Settings', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="d-flex align-items-baseline mb-3">
        <h1 class="h4 fw-medium mb-0">Settings</h1>
        <span class="text-secondary small ms-3" th:text="${board.name}">Board</span>
        <a class="btn btn-sm btn-outline-secondary ms-auto" th:href="@{/boards/{slug}(slug=${board.slug})}">
            <i class="bi bi-arrow-left me-1"></i>Back to board
        </a>
    </div>

    <form method="post" th:action="@{/boards/{slug}/settings(slug=${board.slug})}"
          class="card border-0 shadow-sm" style="max-width: 32rem;">
        <div class="card-body">
            <div class="mb-2">
                <label class="form-label small fw-medium">Slug</label>
                <input class="form-control form-control-sm" th:value="${board.slug}" disabled>
                <div class="form-text">
                    This is the board's URL and cannot be changed here.
                </div>
            </div>

            <div class="mb-2">
                <label class="form-label small fw-medium" for="name">Name</label>
                <input class="form-control form-control-sm" id="name" name="name"
                       th:value="${board.name}" required maxlength="255">
            </div>

            <div class="mb-2">
                <label class="form-label small fw-medium" for="forge">Forge</label>
                <select class="form-select form-select-sm" id="forge" name="forge">
                    <option th:each="f : ${forges}" th:value="${f}" th:text="${f}"
                            th:selected="${f == board.forge}">FORGEJO</option>
                </select>
            </div>

            <div class="mb-2">
                <label class="form-label small fw-medium" for="repository">Repository</label>
                <input class="form-control form-control-sm" id="repository" name="repository"
                       th:value="${board.repository}" required placeholder="owner/name">
            </div>

            <div class="mb-2">
                <label class="form-label small fw-medium" for="defaultBranch">Default branch</label>
                <input class="form-control form-control-sm" id="defaultBranch" name="defaultBranch"
                       th:value="${board.defaultBranch}" placeholder="main">
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="enabled" name="enabled"
                       value="true" th:checked="${board.enabled}">
                <label class="form-check-label small" for="enabled">
                    Enabled - the runner may start work on this board
                </label>
                <div class="form-text">
                    Turning this off pauses the board without losing its pipeline,
                    cards or history. Nothing else changes.
                </div>
            </div>

            <button class="btn btn-sm btn-primary" type="submit">Save</button>
        </div>
    </form>
</th:block>
</body>
</html>
