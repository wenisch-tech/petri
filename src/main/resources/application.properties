spring.application.name=petri
app.version=@project.version@

# H2 by default so Petri starts with no setup at all. Point it at PostgreSQL by
# overriding these, as environment variables or program arguments, e.g.
#   SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/petri
# Flyway owns the schema on both, so nothing else needs to change.
spring.datasource.url=jdbc:h2:file:./data/petri;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Flyway is the single source of truth for schema; Hibernate must never alter it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=${app.version}

springdoc.swagger-ui.path=/swagger-ui.html

server.shutdown=graceful

# Agent gateway. On by default; set false to pause the runner without discarding
# the rest of the configuration. With no base-url there is nothing to call, so
# the runner stays idle and says why.
petri.gateway.enabled=true
# Session API: create, observe and abort agent sessions.
petri.gateway.base-url=
# Repository shim: owns the checkout, the credential and the push gate.
# A separate service from the session API, on its own port.
petri.gateway.repo-api-url=
# Where the gateway keeps a checkout. Its layout, so its setting.
petri.gateway.workspace-template=/data/workspaces/{owner}__{name}
petri.gateway.username=petri
petri.gateway.password=
# A run is bounded by silence, not by elapsed time. One model call on a
# contended GPU was measured at 278s, so a turn making several is legitimately
# long while staying healthy; producing nothing at all is the real signal.
petri.gateway.idle-timeout=PT15M
petri.gateway.max-duration=PT1H
# The gateway lists only busy sessions, so a run is invisible between being
# created and producing its first output. Without this grace it would be
# concluded instantly.
petri.gateway.startup-grace=PT2M
petri.runner.interval=PT10S
petri.liveness.interval=PT10S

# Reviewing model for LLM_VERDICT gates. An OpenAI-compatible endpoint, which is
# what a local proxy in front of self-hosted models exposes as well as the hosted
# services. Point this at a different model from the one that writes the code:
# a reviewer marking its own work is not a review. Unset means verdict gates
# hold rather than pass.
petri.review.base-url=
petri.review.api-key=
petri.review.model=chatgpt
petri.review.timeout=PT5M

# Access. The API key guards the write API, which queues agent work against real
# repositories; unset means the API rejects everything rather than opening up.
# An unset password generates one per run and logs it, so an unconfigured
# install is inconvenient rather than open.
petri.security.username=admin
petri.security.password=
petri.security.api-key=
