# Profile overlay, NOT application.properties.
#
# A file with the base name under src/test/resources replaces the one in
# src/main/resources on the classpath rather than merging with it, so every
# property the main file defines silently disappears from tests. A profile
# overlay layers on top instead: change the database, keep everything else.
spring.datasource.url=jdbc:h2:mem:petri-test;DB_CLOSE_DELAY=-1
spring.h2.console.enabled=false
